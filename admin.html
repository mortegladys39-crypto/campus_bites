<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Bites | Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🍔</span><span>Campus <b>Bites</b><small>Administration</small></span></a><nav><a href="index.html">← Customer Site</a></nav></header>
<main class="admin-main"><section id="admin-login" class="modal admin-login"><p class="eyebrow">RESTRICTED AREA</p><h2>Admin Login</h2><p class="muted">Only authorized administrators can access this dashboard.</p><form id="admin-login-form"><label>Admin email<input id="admin-email" type="email" required></label><label>Password<input id="admin-password" type="password" required></label><button class="btn btn-primary btn-full">Sign In</button></form><p id="login-error" class="form-message"></p></section>
<section id="admin-dashboard" class="hidden"><div class="admin-heading"><div><p class="eyebrow">CAMPUS BITES CONTROL CENTER</p><h1>Admin Dashboard</h1><p class="muted">Manage products and customer orders.</p></div><button id="admin-logout" class="btn btn-light">Sign Out</button></div><div class="admin-tabs"><button class="tab active" data-tab="orders-panel">Orders</button><button class="tab" data-tab="products-panel">Products</button></div>
<div id="orders-panel" class="admin-panel"><div class="panel-title"><h2>Customer Orders</h2><button id="refresh-orders" class="btn btn-light">Refresh</button></div><div id="admin-orders" class="admin-orders"><div class="empty-state">Loading orders…</div></div></div>
<div id="products-panel" class="admin-panel hidden"><div class="panel-title"><h2>Manage Products</h2></div><form id="product-form" class="product-form"><input type="hidden" id="product-id"><label>Product name<input id="product-name" required></label><label>Description<input id="product-description" required></label><label>Price (₱)<input id="product-price" type="number" min="1" step="0.01" required></label><label>Emoji (optional)<input id="product-emoji" placeholder="🍔"></label><label>Product image<input id="product-image" type="file" accept="image/*"></label><div class="form-actions"><button class="btn btn-primary">Save Product</button><button id="cancel-edit" type="button" class="btn btn-light">Clear</button></div><p id="product-message" class="form-message"></p></form><div id="admin-products" class="admin-product-list"></div></div></section></main>
<script type="module" src="admin.js"></script><style>.admin-main{width:min(1100px,92%);margin:55px auto 90px}.admin-login{margin:70px auto}.admin-heading,.panel-title{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-heading h1{font:700 38px 'Playfair Display';margin:0}.admin-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:30px 0 22px}.tab{border:0;background:none;padding:13px 18px;color:var(--muted);font-weight:700;cursor:pointer}.tab.active{color:var(--green);border-bottom:3px solid var(--green)}.admin-panel{background:white;border:1px solid var(--line);border-radius:15px;padding:23px}.panel-title h2{font:700 25px 'Playfair Display';margin:0}.admin-order{border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:13px;display:grid;grid-template-columns:1fr auto;gap:15px}.admin-order h3{font-size:14px;margin:0 0 7px}.admin-order p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.order-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.order-actions select{min-width:130px;margin:0}.small-btn{border:0;border-radius:8px;padding:9px 11px;background:#edf3eb;color:var(--green);font-weight:700;cursor:pointer}.product-form{display:grid;grid-template-columns:repeat(2,1fr);gap:0 15px;padding:10px 0 25px;border-bottom:1px solid var(--line)}.product-form .form-actions,.product-form .form-message{grid-column:1/-1}.form-actions{display:flex;gap:9px}.admin-product-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:20px}.admin-product{border:1px solid var(--line);padding:14px;border-radius:10px}.admin-product b{display:block;margin-bottom:5px}.admin-product small{color:var(--muted)}.admin-product .form-actions{margin-top:12px}@media(max-width:650px){.admin-order{grid-template-columns:1fr}.order-actions{justify-content:flex-start}.product-form,.admin-product-list{grid-template-columns:1fr}.admin-heading h1{font-size:30px}.admin-panel{padding:15px}}</style></body></html>
